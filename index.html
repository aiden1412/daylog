<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하루 시간기록</title>
<meta name="description" content="스톱워치로 하루 활동을 기록하고 자투리 시간을 계산합니다.">
<meta name="theme-color" content="#0F6B66">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 한 손 조작용 단일 컬럼 — 상단 하루 범위, 중앙 스톱워치, 하단 요약과 타임라인(자투리는 빗금 띠) */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --ink:#16232A; --muted:#5D6D72; --line:#DAE2E0;
  --accent:#0F6B66; --accent-ink:#FFFFFF; --accent-soft:#DCEFEC;
  --gap:#B9791A; --gap-soft:#F8EBD2; --danger:#B4412F;
  --font-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1618; --surface:#162125; --ink:#E5EDEB; --muted:#93A4A7; --line:#283739;
  --accent:#43B5AA; --accent-ink:#06201E; --accent-soft:#17332F;
  --gap:#E2AC4A; --gap-soft:#2C2413; --danger:#E27C68; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1618; --surface:#162125; --ink:#E5EDEB; --muted:#93A4A7; --line:#283739;
  --accent:#43B5AA; --accent-ink:#06201E; --accent-soft:#17332F;
  --gap:#E2AC4A; --gap-soft:#2C2413; --danger:#E27C68; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

/* 상단 */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datenav{display:flex;align-items:center;gap:4px}
.datenav h1{font-size:18px;font-weight:700;margin:0;min-width:9.5em;text-align:center}
.navbtn{width:36px;height:36px;border-radius:10px;color:var(--muted);font-size:20px}
.navbtn:hover{background:var(--surface)}
.navbtn:disabled{opacity:.3;cursor:default}
.daybar{display:flex;gap:8px;flex-wrap:wrap}
.daypill{flex:1;min-width:140px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.daypill .lbl{font-size:12px;color:var(--muted);letter-spacing:.02em}
.daypill .val{font-size:16px;font-weight:600}
.daypill button{font-size:13px;font-weight:600;color:var(--accent);padding:4px 8px;border-radius:8px;background:var(--accent-soft)}

/* 예시 안내 */
.notice{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  background:var(--gap-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px}
.notice button{font-weight:600;font-size:13px;color:var(--gap);padding:4px 8px;border:1px solid var(--gap);border-radius:8px}

/* 스톱워치 */
.timer{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 18px;
  display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.timer .state{font-size:13px;color:var(--muted);letter-spacing:.03em}
.timer .clock{font-size:46px;font-weight:600;line-height:1;letter-spacing:-.01em}
.timer .clock.idle{color:var(--muted)}
.timer .sub{font-size:13px;color:var(--muted);min-height:1.5em}
.timer .sub b{color:var(--gap);font-weight:600}
.bigbtn{width:100%;max-width:320px;height:60px;border-radius:16px;font-size:18px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .08s}
.bigbtn:active{transform:scale(.98)}
.bigbtn.start{background:var(--accent);color:var(--accent-ink)}
.bigbtn.stop{background:var(--ink);color:var(--bg)}
.bigbtn svg{width:18px;height:18px;fill:currentColor}
.dot{width:8px;height:8px;border-radius:50%;background:var(--danger);display:inline-block;margin-right:6px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}.bigbtn{transition:none}}

/* 요약 */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.stat .lbl{font-size:12px;color:var(--muted)}
.stat .val{font-size:19px;font-weight:600;white-space:nowrap}
.stat.gapstat .val{color:var(--gap)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.bar span{display:block;height:100%}
.bar .g{background:repeating-linear-gradient(135deg,var(--gap) 0 3px,var(--gap-soft) 3px 7px)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.insight{font-size:13px;color:var(--muted)}
.insight b{color:var(--ink)}

/* 타임라인 */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-top:4px}
.sec-h h2{font-size:15px;margin:0;font-weight:700}
.sec-h span{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.row{display:grid;grid-template-columns:92px 1fr auto;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.row:hover{border-color:var(--accent)}
.row .t{font-size:13px;color:var(--muted);line-height:1.3}
.row .body{min-width:0}
.row .cat{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
.row .cat i{width:8px;height:8px;border-radius:50%}
.row .memo{font-size:14px;overflow-wrap:anywhere}
.row .memo.empty{color:var(--danger);font-size:13px}
.row .d{font-size:13px;font-weight:600;white-space:nowrap}
.row.gaprow{background:repeating-linear-gradient(135deg,var(--gap-soft) 0 6px,transparent 6px 12px);border-style:dashed;border-color:var(--gap);cursor:default}
.row.gaprow .memo{color:var(--gap);font-weight:600;font-size:13px}
.row.gaprow .d{color:var(--gap)}
.row.live{border-color:var(--danger)}
.empty-state{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:14px}

.foot{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-weight:600;font-size:14px}
.foot p{font-size:12px;color:var(--muted);margin:0}
#copybox{width:100%;height:120px;font-family:var(--font-num);font-size:11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px}

/* 입력 시트 */
.backdrop{position:fixed;inset:0;background:rgba(5,15,15,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  max-height:92vh;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-size:17px}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.field input[type=time]{font-family:var(--font-num);font-size:17px}
.field textarea{min-height:76px;resize:vertical}
.durline{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);font-size:14px;background:var(--bg)}
.chip i{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg);font-weight:600}
.chip.add{color:var(--accent);border-style:dashed}
.addcat{display:flex;gap:6px}
.addcat input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.addcat button{padding:8px 12px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.err{color:var(--danger);font-size:13px;min-height:1.2em;margin:0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .primary{grid-column:1/-1;height:52px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px}
.actions .sec{height:44px;border-radius:12px;border:1px solid var(--line);font-weight:600;font-size:14px}
.actions .danger{color:var(--danger);border-color:var(--danger)}

/* 독립 실행용 기본값 */
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}

/* 동기화 상태 */
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);
  border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"] i{background:#3FA34D}
.sync[data-s="busy"] i{background:var(--gap)}
.sync[data-s="wait"] i{background:var(--gap)}
.sync[data-s="err"]{color:var(--danger);border-color:var(--danger)}
.sync[data-s="err"] i{background:var(--danger)}
.sync[data-s="off"]{color:var(--accent);border-color:var(--accent)}
.sync[data-s="off"] i{background:var(--accent)}
.notice.connect{background:var(--accent-soft)}
.notice.connect button{color:var(--accent);border-color:var(--accent)}
.help{font-size:13px;color:var(--muted);margin:0;line-height:1.6}
.help a{color:var(--accent)}
.field select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ok{color:#3FA34D;font-size:13px;margin:0}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="datenav">
      <button class="navbtn" id="prev" aria-label="이전 날짜">‹</button>
      <h1 id="dateTitle">-</h1>
      <button class="navbtn" id="next" aria-label="다음 날짜">›</button>
    </div>
    <button class="sync" id="syncBtn" data-s="off"><i></i><span id="syncText">연결 안 됨</span></button>
  </header>

  <div id="connectBanner" class="notice connect" hidden>
    <span>GitHub에 연결하면 기록이 자동 저장되고 PC에서도 볼 수 있습니다.</span>
    <button id="connectBtn">연결하기</button>
  </div>

  <div class="daybar">
    <div class="daypill"><div><div class="lbl">하루 시작</div><div class="val num" id="dayStartVal">--:--</div></div><button id="dayStartBtn">지금 시작</button></div>
    <div class="daypill"><div><div class="lbl">하루 끝</div><div class="val num" id="dayEndVal">--:--</div></div><button id="dayEndBtn">지금 마침</button></div>
  </div>

  <section class="timer" id="timer" aria-live="polite"></section>

  <section class="summary" id="summary"></section>
  <div class="bar" id="bar" aria-hidden="true"></div>
  <div class="legend" id="legend"></div>
  <p class="insight" id="insight"></p>

  <div class="sec-h"><h2>오늘 한 일</h2><span>항목을 누르면 수정할 수 있습니다</span></div>
  <ul class="list" id="list"></ul>

  <div class="foot">
    <button class="ghost" id="copyBtn">이 날 기록 복사 (Claude 분석용)</button>
    <textarea id="copybox" readonly hidden aria-label="기록 데이터"></textarea>
    <button class="ghost" id="settingsBtn">GitHub 연결 설정</button>
  </div>
</div>

<!-- 기록 입력 시트 -->
<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-in">
    <h3 id="sheetTitle">한 일 기록</h3>
    <div class="times">
      <div class="field"><label for="fStart">시작</label><input type="time" id="fStart"></div>
      <div class="field"><label for="fEnd">종료</label><input type="time" id="fEnd"></div>
    </div>
    <div class="durline" id="durline"></div>
    <div class="field"><label>분류</label><div class="chips" id="chips"></div>
      <div class="addcat" id="addcat" hidden><input id="newCat" placeholder="새 분류 이름" maxlength="10"><button id="addCatBtn">추가</button></div>
    </div>
    <div class="field"><label for="fMemo">한 일</label><textarea id="fMemo" placeholder="예: 예산안 검토, 영어 회화 1강"></textarea></div>
    <p class="err" id="err"></p>
    <div class="actions" id="actions"></div>
  </div>
</div>

<!-- GitHub 연결 설정 시트 -->
<div class="sheet" id="setSheet" hidden role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="sheet-in">
    <h3 id="setTitle">GitHub 연결 설정</h3>
    <p class="help">기록은 비공개 저장소에 날짜별 파일(<span class="num">days/2026-11-23.json</span>)로 저장됩니다. 토큰은 이 기기에만 보관되며 다른 곳으로 전송되지 않습니다.</p>
    <div class="times">
      <div class="field"><label for="gOwner">GitHub 아이디</label><input id="gOwner" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <div class="field"><label for="gRepo">데이터 저장소</label><input id="gRepo" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    </div>
    <div class="field"><label for="gToken">접근 토큰 (github_pat_로 시작)</label><input id="gToken" type="password" autocomplete="off" spellcheck="false" placeholder="토큰을 붙여넣으세요"></div>
    <p class="help">토큰 발급: <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a></p>
    <p class="err" id="gErr"></p>
    <p class="ok" id="gOk"></p>
    <div class="actions">
      <button class="primary" id="gSave">저장하고 연결 확인</button>
      <button class="sec" id="gSync">지금 동기화</button>
      <button class="sec danger" id="gReset">연결 해제</button>
      <button class="sec" id="gClose" style="grid-column:1/-1">닫기</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
